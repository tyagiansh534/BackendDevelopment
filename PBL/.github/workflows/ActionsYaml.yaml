name: Build and Push Docker Image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Route & Health Automation Tests
        run: |
          python automationTesting.py

      - name: Log in to Docker Hub
        if: success()
        run: |
          echo "${{ secrets.DOCKERTOKEN }}" | docker login -u "${{ secrets.DOCKERUSERNAME }}" --password-stdin

      - name: Build Docker Image
        if: success()
        run: |
          docker build -t ${{ secrets.DOCKERUSERNAME }}/fastapi-student-api:v0.1 -t ${{ secrets.DOCKERUSERNAME }}/fastapi-student-api:latest .

      - name: Push Docker Image to Docker Hub
        if: success()
        run: |
          docker push ${{ secrets.DOCKERUSERNAME }}/fastapi-student-api:v0.1
          docker push ${{ secrets.DOCKERUSERNAME }}/fastapi-student-api:latest
