services:
  fastapi-1:
    build: .
    image: fastapi-student-api:v0.1
    container_name: fastapi-node-1
    ports:
      - "8001:8000"
    restart: unless-stopped
    environment:
      - INSTANCE_ID=replica-1

  fastapi-2:
    build: .
    image: fastapi-student-api:v0.1
    container_name: fastapi-node-2
    ports:
      - "8002:8000"
    restart: unless-stopped
    environment:
      - INSTANCE_ID=replica-2

  loadbalancer:
    image: nginx:alpine
    container_name: student-api-lb
    ports:
      - "8080:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - fastapi-1
      - fastapi-2
    restart: always
