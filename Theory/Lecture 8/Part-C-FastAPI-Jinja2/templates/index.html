<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">⚡ FastAPI + Jinja2 SSR</div>
    </header>

    <main class="container">
        <h1>Server-Side Rendering with FastAPI & Jinja2</h1>
        <p class="subtitle">Author: {{ author }} | SAP ID: {{ sapId }}</p>

        <div class="card">
            <h3>Registered Course Offerings</h3>
            <table>
                <thead>
                    <tr>
                        <th>Course Code</th>
                        <th>Course Name</th>
                        <th>Credits</th>
                    </tr>
                </thead>
                <tbody>
                    {% for c in courses %}
                    <tr>
                        <td><strong>{{ c.code }}</strong></td>
                        <td>{{ c.name }}</td>
                        <td>{{ c.credits }}</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </main>
</body>
</html>
