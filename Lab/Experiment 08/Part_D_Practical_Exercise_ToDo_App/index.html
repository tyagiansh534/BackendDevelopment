<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ES6 To-Do App</title>
    <style>
        body { font-family: Arial, sans-serif; max-width: 500px; margin: 40px auto; padding: 0 15px; }
        input { padding: 8px; width: 70%; box-sizing: border-box; }
        button { padding: 8px 16px; cursor: pointer; }
        ul { list-style: none; padding: 0; }
        li { padding: 10px; border-bottom: 1px solid #ddd;
             display: flex; justify-content: space-between; align-items: center; }
        li span { cursor: pointer; flex-grow: 1; margin-right: 10px; }
        .done { text-decoration: line-through; color: gray; }
        .delete-btn { background: red; color: white; border: none; border-radius: 3px; }
        .back-link { display: inline-block; margin-bottom: 20px; color: #2563eb; text-decoration: none; font-weight: bold; }
        .back-link:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <a href="../index.html" class="back-link">&larr; Back to Main Index</a>
    <h1>My To-Do List</h1>
    <input type="text" id="taskInput" placeholder="Enter a task...">
    <button id="addBtn">Add</button>
    <ul id="taskList"></ul>

    <script src="app.js"></script>
</body>
</html>
